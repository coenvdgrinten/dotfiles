# BlueZ main configuration for stable Bluetooth audio
# Install: sudo cp /path/to/dotfiles/etc/bluetooth/main.conf /etc/bluetooth/main.conf

[General]
# Enable Fast Connectable to reduce connection time and improve stability
FastConnectable = true

# Increase the reconnect retry delay to prevent aggressive reconnection loops
ReconnectAttempts = 5
ReconnectIntervals = 1 2 4 8 16

[Policy]
# Auto-enable reconnect for headsets
AutoEnable = true

[A2DP]
# Use faster media bridging for better A2DP stability
MediaRole = sink

[Bluetooth]
# Enable dual profiles (A2DP + HFP) but prefer A2DP
Enable = Source,Sink,Headset,AudioSink,MediaEndpoint,SAPRelease,PnP,HFPPE
