# *********************************************************** #
#
# NOTE: workspaces.conf is only overwritten by NWG-Displays if you use
# the "Workspaces" tab inside nwg-displays and click its Apply button.
# Changing monitor layout (resolutions / positions) does NOT touch this file.
#
# *********************************************************** #

# You can set workspace rules to achieve workspace-specific behaviors. 
# For instance, you can define a workspace where all windows are drawn without borders or gaps.

# https://wiki.hyprland.org/Configuring/Workspace-Rules/

# Persistent workspace assignments — each monitor gets multiple workspaces so
# Super+Tab / Super+Shift+Tab can cycle per-monitor, and Super+1-9 still jumps
# to the correct monitor.  Matches the app-to-workspace rules in WindowRules.conf:
#   ws 1 = general, ws 2 = browsers, ws 3 = VSCode, ws 4 = terminals,
#   ws 5 = Spotify, ws 6 = Zulip, ws 7 = file-manager, ws 8 = Gemini, ws 9 = Gmail

# eDP-1 (laptop, 1920×1080 @ left)
workspace = 1, monitor:eDP-1, persistent:true

# DP-5 (Dell P2314H, rotated 90°)
workspace = 2, monitor:DP-5, persistent:true
workspace = 6, monitor:DP-5, persistent:true

# DP-6 (Iiyama 2560×1440, centre — primary work screen)
workspace = 3, monitor:DP-6, persistent:true
workspace = 7, monitor:DP-6, persistent:true
workspace = 8, monitor:DP-6, persistent:true
workspace = 9, monitor:DP-6, persistent:true

# DP-7 (Dell P2314H, right)
workspace = 4, monitor:DP-7, persistent:true
workspace = 5, monitor:DP-7, persistent:true
workspace = 10, monitor:DP-7, persistent:true

# example rules (from wiki)
# workspace = 3, rounding:false, decorate:false
# workspace = name:coding, rounding:false, decorate:false, gapsin:0, gapsout:0, border:false, decorate:false, monitor:DP-1
# workspace = 8,bordersize:8
# workspace = name:Hello, monitor:DP-1, default:true
# workspace = name:gaming, monitor:desc:Chimei Innolux Corporation 0x150C, default:true
# workspace = 5, on-created-empty:[float] firefox
# workspace = special:scratchpad, on-created-empty:foot

# Smaller gaps for the special workspace (SUPER+U)
workspace = special, gapsin:0, gapsout:2