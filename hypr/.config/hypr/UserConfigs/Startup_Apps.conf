# Commands and Apps to be executed at launch

# Auto-launch apps to specific workspaces
exec-once = hyprctl dispatch exec [workspace 1] brave
exec-once = hyprctl dispatch exec [workspace 2] code-insiders
exec-once = hyprctl dispatch exec [workspace 7] spotify

# Cortex development terminals (workspace 4)
exec-once = hyprctl dispatch exec [workspace 4] kitty -e bash -c 'cd /home/cvdgrinten/Documents/Code/cortex && ./run-cypress || read'
exec-once = hyprctl dispatch exec [workspace 4] kitty -e bash -c 'cd /home/cvdgrinten/Documents/Code/cortex/cypress && ./run || read'
# Recover from "external monitor session left eDP-1 disabled" → black screen on next boot
exec-once = $HOME/.config/hypr/scripts/ensure-laptop-display.sh

